<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %}</title>
</head>
<!-- Email clients ignore most external CSS, so every style is written inline
     and the layout uses <table> instead of flexbox/grid. -->
<body style="margin:0;padding:0;background:#f4f6f8;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
         style="background:#f4f6f8;padding:24px 0;">
    <tr><td align="center">
      <table role="presentation" width="560" cellpadding="0" cellspacing="0"
             style="max-width:560px;width:100%;background:#ffffff;border-radius:8px;overflow:hidden;">
        <tr>
          <!-- The colour is in bgcolor, not in style: a template tag inside style="..."
               is not valid CSS. bgcolor also works in every email client, even Outlook. -->
          <td bgcolor="{% block color %}#1a73e8{% endblock %}"
              style="padding:20px 28px;color:#ffffff;font-size:20px;font-weight:bold;">
            {% block heading %}{% endblock %}
          </td>
        </tr>
        <tr>
          <td style="padding:28px;color:#202124;font-size:15px;line-height:1.6;">
            {% block content %}{% endblock %}
          </td>
        </tr>
        <tr>
          <td style="padding:16px 28px;background:#fafafa;color:#80868b;font-size:12px;">
            Sent automatically by the Absence Request Demo (Gmail SMTP, OAuth 2.0). If you did not expect this email, you can ignore it.
          </td>
        </tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
