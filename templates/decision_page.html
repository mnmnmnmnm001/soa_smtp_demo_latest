<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
</head>
<body style="margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f6f8;">
  <div style="max-width:480px;margin:12vh auto;background:#ffffff;border-radius:8px;
              overflow:hidden;text-align:center;">
    <!-- coloured strip on top: colour in bgcolor, so no template tag inside style="..." -->
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr><td bgcolor="{{ color }}" style="height:6px;font-size:0;line-height:0;">&nbsp;</td></tr>
    </table>
    <div style="padding:32px;">
      <h2 style="margin-top:0;color:#202124;">{{ title }}</h2>
      <p style="color:#5f6368;line-height:1.6;">{{ message }}</p>
    </div>
  </div>
</body>
</html>
